{% extends "base.html" %}
{% block title %}Edit Profile{% endblock %}

{% block content %}
<div class="container mt-4 d-flex justify-content-center">
    <div class="profile-card card bg-black p-4 border-gold shadow-lg animate-fade-slide">
        <h2 class="text-gold mb-3">Edit Profile</h2>

        <form method="post">
            {% csrf_token %}

            <label class="text-gold">First Name</label>
            <input name="first_name" class="form-control mb-3"
                   value="{{ request.user.first_name }}">

            <label class="text-gold">Last Name</label>
            <input name="last_name" class="form-control mb-3"
                   value="{{ request.user.last_name }}">

            <label class="text-gold">Email</label>
            <input name="email" type="email" class="form-control mb-4"
                   value="{{ request.user.email }}">

            <div class="d-flex justify-content-center mt-3">
                <button type="submit" class="btn btn-gold w-50">
                    Save Changes
                </button>
            </div>

        </form>
    </div>
</div>
{% endblock %}
