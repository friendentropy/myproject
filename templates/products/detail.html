{% extends "base.html" %}
{% load static %}

{% block title %}{{ product.name }}{% endblock %}

{% block content %}
<div class="container mt-4">

    <div class="row g-4">
        <div class="col-md-5">
            <div class="detail-img-wrapper">
                <img src="{{ product.image.url }}" class="img-fluid detail-img" alt="{{ product.name }}">
            </div>
        </div>

        <div class="col-md-7">
            <h2 class="text-accent">{{ product.name }}</h2>

            <p class="mt-3">{{ product.description }}</p>

            <h3 class="mt-3 text-accent">${{ product.price }}</h3>

            <form action="{% url 'products:cart_add' product.id %}" method="post" class="mt-4">
                {% csrf_token %}
                <button type="submit" class="btn btn-warning w-100">Add to Cart</button>
            </form>

        </div>
    </div>

</div>
{% endblock %}
