{% extends "base.html" %}
{% load static %}

{% block title %}Products{% endblock %}

{% block content %}

<div class="container mt-4">
  <h1 class="mb-4">The Gold Shop</h1>

  <div class="row g-4">
    {% for product in products %}
      <div class="col-6 col-md-4 col-lg-3">
        <div class="card product-card h-100">
          <div class="card-img-wrapper">
            {% if product.image %}
              <img src="{{ product.image.url }}" class="card-img-top product-img" alt="{{ product.name }}">
            {% else %}
              <img src="{% static 'placeholder.png' %}" class="card-img-top product-img" alt="{{ product.name }}">
            {% endif %}
          </div>
          <div class="card-body d-flex flex-column">
            <h5 class="card-title product-title">{{ product.name }}</h5>
            <p class="card-text product-price mb-3">${{ product.price }}</p>
            <div class="mt-auto d-flex justify-content-between align-items-center">
              <a href="{{ product.get_absolute_url }}" class="btn btn-gold btn-sm">View</a>
              <form method="post" action="{% url 'products:cart_add' product.id %}">
                {% csrf_token %}
                <input type="hidden" name="quantity" value="1"/>
                <button class="btn btn-outline-secondary btn-sm" type="submit">Add</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    {% endfor %}
  </div>
</div>

{% endblock %}
